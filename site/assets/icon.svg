<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#3b4252"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- three connected nodes: a sharing symbol -->
  <g stroke="#88c0d0" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="150" y1="340" x2="256" y2="170"/>
    <line x1="256" y1="170" x2="362" y2="340"/>
    <line x1="150" y1="340" x2="362" y2="340"/>
  </g>
  <g fill="#eceff4">
    <circle cx="150" cy="340" r="34"/>
    <circle cx="256" cy="170" r="34"/>
    <circle cx="362" cy="340" r="34"/>
  </g>
</svg>
