name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libsdbus-c++-dev libpipewire-0.3-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # There is no .clang-format in this repo and the code follows a custom
      # style, so a cargo-cult `clang-format --dry-run --Werror` would fail on
      # every file. These checks are the ones the project actually guarantees.
      - name: Source hygiene
        run: |
          set -euo pipefail
          if grep -rEn '^(<<<<<<<|=======|>>>>>>>)' src include tests; then
            echo "merge conflict markers found" >&2
            exit 1
          fi
          test -f LICENSE
          test -f CMakeLists.txt
          echo "source hygiene OK"

      - name: CLI command names are registered
        run: |
          set -euo pipefail
          # Every handler header included by main.cpp must exist.
          grep -oE '#include "cmd_[^"]+\.hpp"' src/bin/hyprshare/main.cpp \
            | sed -E 's/#include "(.*)"/\1/' \
            | while read -r h; do test -f "src/bin/hyprshare/$h"; done
          echo "command includes OK"

  package:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libsdbus-c++-dev libpipewire-0.3-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Create package
        run: |
          cd build
          cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyprshare-package
          path: build/*.deb
